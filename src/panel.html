<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Detector — Opérations</title><style>
:root{color-scheme:dark;--bg:#07110f;--card:#10201c;--line:#24443a;--text:#effbf6;--muted:#89a99d;--ok:#35e49a;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:radial-gradient(circle at 15% 0,#14372d,var(--bg) 42%);color:var(--text)}main{max-width:1200px;margin:auto;padding:42px 22px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{font-size:clamp(28px,5vw,52px);margin:0;letter-spacing:-.04em}.eyebrow,.muted{color:var(--muted)}#overall{padding:10px 16px;border:1px solid var(--line);border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:16px}.card{background:linear-gradient(145deg,#132820dd,#0c1916ee);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 16px 40px #0004}.top{display:flex;justify-content:space-between}.ticker{font-size:24px;font-weight:750}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px var(--ok)}.bad .dot{background:var(--bad);box-shadow:0 0 14px var(--bad)}dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:20px 0}dt{color:var(--muted)}dd{margin:0;font-variant-numeric:tabular-nums}.address{font:12px ui-monospace;word-break:break-all;border-top:1px solid var(--line);padding-top:14px}.warning{color:var(--bad);font-weight:700}.empty{text-align:center;padding:50px;color:var(--muted)}
</style></head><body><main><header><div><div class="eyebrow">TAILNET · TEMPS RÉEL</div><h1>Crypto Detector</h1></div><div id="overall">Connexion…</div></header><section id="cards" class="grid"></section><p class="muted">Actualisation automatique toutes les 5 secondes · <span id="time">—</span></p></main><script>
const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{const r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();overall.textContent=d.overall;overall.className=d.overall==='opérationnel'?'':'warning';cards.innerHTML=d.chains.length?d.chains.map(c=>`<article class="card ${(!c.rpc_reachable||c.gas_low)?'bad':''}"><div class="top"><div><div class="ticker">${esc(c.ticker)}</div><div class="muted">${esc(c.chain)}</div></div><i class="dot"></i></div><dl><dt>Détecteur</dt><dd>${esc(c.detector)}</dd><dt>RPC / explorer</dt><dd>${c.rpc_reachable?'joignable':'indisponible'}</dd><dt>File de paiements</dt><dd>${c.pending_payments}</dd><dt>Paiements crédités</dt><dd>${c.credited_payments}</dd><dt>Curseur</dt><dd>${esc(c.cursor)}</dd>${c.gas_address?`<dt>Réserve gaz</dt><dd class="${c.gas_low?'warning':''}">${c.gas_balance==null?'—':c.gas_balance.toFixed(6)} ${esc(c.gas_symbol)}</dd><dt>Minimum</dt><dd>${c.gas_minimum} ${esc(c.gas_symbol)}</dd>`:''}</dl>${c.gas_address?`<div class="address"><span class="muted">Adresse gaz</span><br>${esc(c.gas_address)}</div>`:''}${c.error?`<p class="warning">${esc(c.error)}</p>`:''}</article>`).join(''):'<div class="empty">Aucune chaîne configurée</div>';time.textContent=new Date(d.generated_at_unix*1000).toLocaleString('fr-FR')}catch(e){overall.textContent='Panel déconnecté';overall.className='warning'}}refresh();setInterval(refresh,5000);
</script></body></html>
