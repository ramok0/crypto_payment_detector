[package]
name = "crypto_payment_detector"
version = "0.2.0"
edition = "2024"

[lib]
name = "crypto_payment_detector"
path = "src/lib.rs"

[[bin]]
name = "crypto_payment_detector"
path = "src/main.rs"

[[bin]]
name = "crypto_payment_api"
path = "src/api.rs"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "gzip", "rustls", "socks"] }
reqwest_ethers = { package = "reqwest", version = "0.11", default-features = false, features = ["json", "gzip", "rustls-tls", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.0", features = ["full"] }
futures-util = "0.3"
flate2 = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bech32 = "0.11"
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dotenvy = "0.15.7"
rayon = "1.10"
axum = "0.8"
redis = { version = "0.32", features = ["tokio-comp"] }
bs58 = "0.5"
bincode = "1.3"
solana-sdk = "2.2"
solana-system-interface = "1.0.0"
ethers = "2.0"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "webhook_server"
path = "examples/webhook_server.rs"
